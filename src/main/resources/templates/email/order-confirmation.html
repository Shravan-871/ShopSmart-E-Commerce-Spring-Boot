<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Order Confirmation</title>
</head>
<body style="font-family:Arial,sans-serif;color:#222;line-height:1.5;">
    <h2 style="color:#6c63ff;">Thank you for your order!</h2>
    <p>Hi <span th:text="${order.username}">customer</span>,</p>
    <p>Your order <strong th:text="'#' + ${order.id}">#0</strong> has been confirmed.</p>
    <table style="border-collapse:collapse;width:100%;max-width:480px;margin:1rem 0;">
        <thead>
            <tr>
                <th style="text-align:left;border-bottom:1px solid #ddd;padding:6px;">Item</th>
                <th style="text-align:right;border-bottom:1px solid #ddd;padding:6px;">Qty</th>
                <th style="text-align:right;border-bottom:1px solid #ddd;padding:6px;">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${order.items}">
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;" th:text="${item.productName}">Item</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;text-align:right;" th:text="${item.quantity}">1</td>
                <td style="padding:6px;border-bottom:1px solid #f0f0f0;text-align:right;"
                    th:text="'₹' + ${#numbers.formatDecimal(item.productPrice, 1, 2)}">₹0</td>
            </tr>
        </tbody>
    </table>
    <p style="font-size:1.1rem;">
        <strong>Total:</strong>
        <span th:text="'₹' + ${#numbers.formatDecimal(order.total, 1, 2)}">₹0</span>
    </p>
    <p style="color:#666;font-size:0.9rem;">— ShopSmart</p>
</body>
</html>
